services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - sqlite_data:/var/lib/sqlite
      # УБЕРИТЕ эту строку: - ./backend/clarnetta-app:/var/www
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/lib/sqlite/database.sqlite
    command: >
      sh -c "
        # Создаем базу данных если её нет
        if [ ! -f /var/lib/sqlite/database.sqlite ]; then
          mkdir -p /var/lib/sqlite &&
          touch /var/lib/sqlite/database.sqlite &&
          chmod 666 /var/lib/sqlite/database.sqlite
        fi &&
        # Устанавливаем права
        chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache /var/lib/sqlite &&
        # Запускаем миграции
        php artisan migrate --force &&
        # Запускаем сервер
        nginx && php-fpm
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  sqlite_data: