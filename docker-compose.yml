services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/clarnetta-app:/var/www
      - sqlite_data:/var/lib/sqlite
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/lib/sqlite/database.sqlite
    command: >
      sh -c "
        # Создаем необходимые папки если их нет
        mkdir -p /var/www/storage/framework/cache/data \
                 /var/www/storage/framework/sessions \
                 /var/www/storage/framework/views \
                 /var/www/storage/logs \
                 /var/www/bootstrap/cache \
                 /var/lib/sqlite
        
        # Создаем базу данных если её нет
        if [ ! -f /var/lib/sqlite/database.sqlite ]; then
          touch /var/lib/sqlite/database.sqlite
        fi
        
        # Устанавливаем права
        chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache /var/lib/sqlite
        chmod -R 775 /var/www/storage /var/www/bootstrap/cache
        chmod 666 /var/lib/sqlite/database.sqlite
        
        # Запускаем миграции
        cd /var/www && php artisan migrate --force
        
        # Запускаем сервер
        nginx && php-fpm
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  sqlite_data: